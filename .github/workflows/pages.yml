name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Release']
    types:
      - completed

permissions:
  contents: read

jobs:
  build:
    name: Build Demo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # `demo/index.html` loads the bundle from next to itself, so the build only has to put it there.
      # The `.js` extension is deliberate: GitHub Pages serves `.cjs` as `application/node`, which
      # browsers reject as a JavaScript MIME type.
      - name: Prepare demo
        run: cp dist/maplibre-versatiles-styler.umd.cjs demo/maplibre-versatiles-styler.umd.js

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./demo

  deploy:
    name: Deploy to GitHub Pages
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
