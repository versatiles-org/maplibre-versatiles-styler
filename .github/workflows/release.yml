name: Release

# Started by the tag that `npm run release` (`vrt release`) pushes. Nothing is published from the
# maintainer's machine: this workflow checks and packs the tagged commit, then publishes that tarball
# to npm with trusted publishing and provenance, and creates the GitHub release.
# Setup: https://github.com/versatiles-org/node-release-tool#release-workflow
#
# `vrt release` watches this workflow by its name, so keep it "Release". `pages.yml` also runs after it.

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Checks that the tag matches package.json and has notes in CHANGELOG.md, that the tagged commit is
  # on main, runs `check:release`, and packs the npm tarball (`prepack`: `check:deps` and the build).
  #
  # No e2e tests here: `vrt release` tags only after CI, e2e included, has passed on the commit, and
  # the release commit on top of it changes nothing but the version and CHANGELOG.md. Running the
  # browsers again would test the same code, against live tiles, after the tag is already pushed.
  # `check:release` is the same gate CI runs, so a commit that passed CI passes it too.
  build:
    name: Verify, test and pack
    uses: versatiles-org/node-release-tool/.github/workflows/release.yml@v2.23.0
    permissions:
      contents: read
    with:
      check-script: check:release

  # The one job with the right to publish. npm only accepts trusted publishing from the workflow file
  # and environment configured on npmjs.com, so it lives here and not in the reusable workflow. It has
  # no checkout and no cache: it publishes exactly the tarball that `build` packed.
  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # GitHub release
      id-token: write # npm trusted publishing
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          # npm 11.5.1 or newer is needed for trusted publishing
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          name: release
          path: release

      # Skips a version that npm already has, so a re-run is safe, and publishes a prerelease with
      # the dist-tag "next". Creates the GitHub release with the notes from CHANGELOG.md.
      - name: Publish to npm and create the GitHub release
        run: npx --yes "@versatiles/release-tool@${{ needs.build.outputs.tool-version }}" release-publish release --tag "$GITHUB_REF_NAME"

      # The bundles for downloading from the release page, taken from the npm tarball, so they are
      # the files that were tested and published.
      - name: Upload the bundles to the GitHub release
        working-directory: release
        run: |
          tar -xzf maplibre-versatiles-styler-*.tgz package/dist
          cd package/dist
          tar -cf - maplibre-versatiles-styler.* | gzip -9 > ../../maplibre-versatiles-styler.tar.gz
          cd ../..
          gh release upload "$GITHUB_REF_NAME" maplibre-versatiles-styler.tar.gz --clobber
