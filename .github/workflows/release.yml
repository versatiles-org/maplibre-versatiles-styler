name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A tag doesn't trigger CI, so the release has to run the same checks itself. The jobs mirror
  # ci.yml: a fast gate, then the two browser jobs in parallel, then the release.
  check:
    name: Typecheck, Lint and Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

  e2e-chromium:
    name: E2E Tests (Chromium)
    runs-on: ubuntu-latest
    # Nothing to learn from twenty minutes of browsers if the unit tests already failed.
    needs: check
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e -- --project=chromium

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-chromium
          path: playwright-report/
          retention-days: 30

  # The layout and stability checks in the other engines, on macOS because a Linux runner has no GPU
  # and gives Firefox no WebGL at all — MapLibre needs WebGL2, so every test there fails before the
  # map exists. macOS also runs the real Safari engine. Runners are free for a public repository.
  e2e-cross-browser:
    name: E2E Tests (Firefox, WebKit)
    runs-on: macos-latest
    needs: check
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps firefox webkit

      - name: Run E2E tests
        run: npm run test:e2e -- --project=firefox --project=webkit

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-cross-browser
          path: playwright-report/
          retention-days: 30

  release:
    name: Build and release
    runs-on: ubuntu-latest
    needs: [e2e-chromium, e2e-cross-browser]
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Get version
        run: 'echo "RELEASE_TAG=v$(jq -r ''.version'' package.json)" >> $GITHUB_ENV'

      - name: Build code
        run: npm run build

      - name: Tar and compress
        run: tar -cf - maplibre-versatiles-styler.* | gzip -9 > maplibre-versatiles-styler.tar.gz
        working-directory: dist

      - name: Upload file to release
        run: gh release upload $RELEASE_TAG *.gz --clobber
        working-directory: dist

      - name: Update release
        run: gh release edit $RELEASE_TAG --draft=false --latest --prerelease=false
